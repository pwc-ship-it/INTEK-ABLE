<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,date=no,address=no">
<meta name="theme-color" content="#ffffff">
<title>BU3 · ABLE 현장 업무</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#f8fafc; --line:#e2e8f0; --line2:#cbd5e1;
  --text:#0f172a; --text2:#334155; --muted:#64748b; --faint:#94a3b8;
  --pri:#2563eb; --pri-bg:#eff6ff; --pri-d:#1d4ed8;
  --hq:#2563eb; --hq-bg:#dbeafe; --able:#ea580c; --able-bg:#ffedd5;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#dc2626; --bad-bg:#fee2e2;
  --radius:10px; --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}

/* ── 상단 ── */
.top{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1600px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:-.2px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#ea580c);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.brand small{font-weight:600;color:var(--muted);font-size:12px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);cursor:pointer;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok .dot{background:#16a34a}.sync.busy .dot{background:#f59e0b}.sync.err .dot{background:#dc2626}.sync.local .dot{background:#a855f7}
.spacer{flex:1}
.tabs{display:flex;gap:4px;padding:0 16px;max-width:1600px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 11px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.tab .cnt{display:inline-block;margin-left:4px;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--text2);vertical-align:2px}
.tab.on .cnt{background:var(--pri-bg);color:var(--pri)}
.banner{display:none;background:#faf5ff;border-bottom:1px solid #e9d5ff;color:#6b21a8;font-size:13px;padding:8px 16px;text-align:center}
.banner.show{display:block}
.banner button{border:0;background:none;color:#7e22ce;font-weight:700;text-decoration:underline}

main{max-width:1600px;margin:0 auto;padding:16px}
.view{display:none}.view.on{display:block}

/* ── 공통 요소 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px}
.card-b{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:13px;color:var(--text2);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface2);border-color:var(--faint)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.danger{color:var(--bad);border-color:#fecaca}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:34px;padding:0 12px;font-weight:600;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:#fff}
.inp,.sel,.ta{width:100%;height:40px;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:0 11px;font-size:14px;outline:none;transition:border-color .12s,box-shadow .12s}
.ta{height:auto;min-height:92px;padding:9px 11px;resize:vertical;line-height:1.55}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--text2);margin:0 0 5px}
.lbl .req{color:var(--bad)}
.lbl .hint{font-weight:500;color:var(--faint);margin-left:4px}
.fg{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.toolbar .inp,.toolbar .sel{width:auto;height:36px;font-size:13px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);white-space:nowrap;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--pri)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1}
.b-hq{background:var(--hq-bg);color:#1e40af}.b-able{background:var(--able-bg);color:#9a3412}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-go{background:#dbeafe;color:#1d4ed8}.b-plan{background:#e0e7ff;color:#4338ca}.b-done{background:#f1f5f9;color:#64748b}
.b-gray{background:#f1f5f9;color:#475569}
.site-chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;padding:2px 8px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.site-chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:15px;color:var(--text2);margin-bottom:4px}

/* ── 일일보고 ── */
.dr-grid{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
.dr-form{position:sticky;top:calc(var(--hh,96px) + 12px)}
.dr-form.editing{outline:2px solid var(--warn);outline-offset:-1px}
.edit-note{display:none;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:700;padding:7px 16px}
.dr-form.editing .edit-note{display:flex;align-items:center;justify-content:space-between}
.today-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;margin-bottom:12px}
.today-strip .ts-t{font-weight:800;font-size:14px;margin-right:4px}
.today-strip .ts-n{font-size:13px;color:var(--text2)}
.today-strip .ts-n b{font-size:16px}
.pchip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line2);background:#fff;cursor:pointer}
.pchip.done{background:var(--ok-bg);border-color:#bbf7d0;color:var(--ok)}
.pchip.todo{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
.grp{margin-bottom:14px}
.grp-h{display:flex;align-items:center;gap:8px;padding:10px 4px 8px;font-weight:800;font-size:15px;position:sticky;top:var(--hh,96px);background:var(--bg);z-index:5}
.grp-h .n{font-size:12px;color:var(--muted);font-weight:600}
.grp-h .act{margin-left:auto}
.rp{padding:14px 16px;margin-bottom:10px}
.rp-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:10px}
.rp-h .who{font-weight:800;font-size:15px}
.rp-h .date{font-weight:700;color:var(--text2);font-size:13px}
.rp-h .tools{margin-left:auto;display:flex;gap:4px}
.rp-sec{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.rp-sec:first-of-type{border-top:0}
.rp-sec .k{font-size:12px;font-weight:800;color:var(--muted);padding-top:1px}
.rp-sec .k.p{color:var(--pri)}.rp-sec .k.n{color:#7c3aed}.rp-sec .k.i{color:var(--bad)}
.rp-sec .v{white-space:pre-wrap;word-break:break-word;color:var(--text);font-size:14px}
.rp-meta{font-size:11px;color:var(--faint);margin-top:6px;text-align:right}

/* ── 간트 ── */
.gantt-wrap{position:relative;overflow:auto;max-height:calc(100vh - 210px);min-height:300px;background:#fff;border-radius:var(--radius)}
.gantt{position:relative}
.g-head{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line2);display:flex}
.g-corner{position:sticky;left:0;z-index:25;background:#fff;border-right:1px solid var(--line2);flex:none;display:flex;align-items:flex-end;padding:0 10px 6px;font-size:12px;font-weight:700;color:var(--muted)}
.g-scale{position:relative;flex:none}
.g-mon{position:absolute;top:0;height:24px;border-left:1px solid var(--line);font-size:12px;font-weight:800;padding:4px 6px;white-space:nowrap;overflow:hidden;color:var(--text2)}
.g-day{position:absolute;top:24px;height:22px;font-size:10px;text-align:center;color:var(--muted);line-height:22px;border-left:1px solid #f1f5f9}
.g-day.we{color:#dc2626;background:#fef2f2}
.g-day.td{background:var(--pri);color:#fff;font-weight:800;border-radius:4px}
.g-body{position:relative}
.g-bg{position:absolute;top:0;bottom:0;pointer-events:none}
.g-we{position:absolute;top:0;bottom:0;background:#f8fafc}
.g-mline{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--pri);opacity:.75;z-index:3}
.g-row{display:flex;position:relative;border-bottom:1px solid #eef2f7}
.g-row.site{background:#f8fafc;border-bottom:1px solid var(--line)}
.g-lc{position:sticky;left:0;z-index:10;background:#fff;border-right:1px solid var(--line2);flex:none;padding:5px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.g-row.site .g-lc{background:#f8fafc;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;font-weight:800;font-size:13px}
.g-lc .nm{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden}
.g-lc .nm span.t{overflow:hidden;text-overflow:ellipsis}
.g-lc .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-tl{position:relative;flex:none}
.g-bar{position:absolute;top:7px;height:24px;border-radius:6px;color:#fff;font-size:11.5px;font-weight:700;line-height:24px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:4;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.g-bar.hq{background:var(--hq)}.g-bar.able{background:var(--able)}
.g-bar.done{opacity:.42}
.g-bar.plan{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.g-bar span{position:sticky;display:inline-block}
.g-bar:hover{filter:brightness(1.08);z-index:6}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text2);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* 목록 보기 */
.tl-sec{margin-bottom:16px}
.tl-sec h3{font-size:14px;margin:4px 2px 8px;display:flex;align-items:center;gap:6px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tcard{padding:12px 14px;cursor:pointer;border-left:4px solid var(--hq)}
.tcard.able{border-left-color:var(--able)}
.tcard:hover{border-color:var(--line2)}
.tcard .r1{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tcard .r1 b{font-size:15px}
.tcard .r1 .dd{margin-left:auto;font-weight:800;font-size:13px}
.tcard .r2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--text2)}

/* ── 인원별 ── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.stat{padding:12px 14px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.stat .l{font-size:13px;font-weight:700;color:var(--text2)}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.feas{padding:12px 14px;margin-bottom:12px}
.feas-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.feas-row .ttl{font-weight:800;margin-right:4px}
.feas-row .inp,.feas-row .sel{width:auto;height:36px;font-size:13px}
.feas-res{margin-top:10px;font-size:13px;line-height:1.7;display:none;padding:10px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.feas-res.show{display:block}
.ptable{width:100%;border-collapse:separate;border-spacing:0;background:#fff;font-size:13px}
.ptable th{position:sticky;top:var(--hh,96px);z-index:4;background:#f8fafc;color:var(--text2);font-weight:800;font-size:12px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
.ptable th.num,.ptable td.num{text-align:right}
.ptable th .ar{color:var(--pri)}
.ptable td{padding:9px 10px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.ptable tr.pr{cursor:pointer}
.ptable tr.pr:hover td{background:#f8fafc}
.ptable tr.exp td{background:#fbfcfe;padding:0}
.pname{font-weight:800;font-size:14px}
.meter{display:flex;align-items:center;gap:8px;min-width:150px}
.meter .bar{flex:1;height:8px;border-radius:99px;background:#eef2f7;overflow:hidden;position:relative}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#16a34a}
.meter .bar i.w{background:#f59e0b}.meter .bar i.b{background:#dc2626}
.meter .num{font-weight:800;font-size:14px;min-width:62px;text-align:right;white-space:nowrap}
.meter .num small{font-weight:600;color:var(--muted);font-size:11px}
.hist{padding:10px 14px 14px 34px}
.hist table{width:100%;border-collapse:collapse;font-size:12.5px}
.hist th{text-align:left;color:var(--muted);font-size:11.5px;font-weight:700;padding:5px 8px;border-bottom:1px solid var(--line)}
.hist td{padding:6px 8px;border-bottom:1px solid #f1f5f9}
.pcards{display:none}
.pcard{padding:12px 14px;margin-bottom:10px}
.pcard .h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pcard .h .pname{font-size:16px}
.pcard .h .st{margin-left:auto}
.pcard .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 8px;font-size:13px;align-items:center}
.pcard .kv .k{color:var(--muted);font-weight:700;font-size:12px}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}

/* ── 모달 ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
.modal-h .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 14px 14px}
.modal-f .left{margin-right:auto}
.check-box{margin-top:4px;padding:10px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:13px;line-height:1.65}
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th{text-align:left;font-size:12px;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line)}
.mtable td{padding:5px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.mtable .inp,.mtable .sel{height:34px;font-size:13px}
.mtable input[type=color]{width:36px;height:30px;border:1px solid var(--line2);border-radius:6px;padding:2px;background:#fff}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .2s;z-index:200;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#b91c1c}
.fab{display:none}
.pm-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.rules{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:#fff;border:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--text2)}
.chip.pri{background:var(--pri-bg);border-color:#bfdbfe;color:var(--pri)}
.lbl2{display:inline-flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--muted);gap:3px}
.tblwrap{overflow:auto;max-height:calc(100vh - var(--hh,96px) - 40px)}
.xt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff}
.xt th{position:sticky;top:0;z-index:4;background:#f8fafc;color:var(--text2);font-weight:800;font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;line-height:1.3;vertical-align:bottom}
.xt th small{font-weight:600;color:var(--muted);font-size:10.5px}
.xt th .ar{color:var(--pri)}
.xt td{padding:8px 10px;border-bottom:1px solid #eef2f7;vertical-align:middle;white-space:nowrap}
.xt .num{text-align:right}
.xt td.sm{font-size:12px;color:var(--text2)}
.xt .stk{position:sticky;left:0;z-index:2;background:#fff;box-shadow:1px 0 0 var(--line)}
.xt th.stk{z-index:6;background:#f8fafc}
.xt td.hl{background:#f0f9ff}
.xt .usc{background:#eff6ff}
.xt tr.pr{cursor:pointer}
.xt tr.pr:hover td{background:#f8fafc}
.xt tr.exp td{background:#fbfcfe;padding:0;white-space:normal}
.why{font-size:11px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.xt .meter{min-width:140px}

/* ── 반응형 ── */
@media (max-width:1100px){
  .dr-grid{grid-template-columns:340px 1fr}
  .stats{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  .dr-grid{grid-template-columns:1fr}
  .dr-form{position:static}
  .ptable,.ptwrap{display:none}
  .pcards{display:block}
}
@media (max-width:640px){
  body{font-size:15px}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 10px}.stat .v{font-size:19px}.stat .l{font-size:11.5px;line-height:1.3}.stat .s{display:none}
  .pm-top .seg{width:100%;display:flex}.pm-top .seg button{flex:1;padding:0 6px}
  .top-in{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .tabs{padding:0 6px}
  .tab{font-size:14px;padding:9px 4px 10px;flex:1}
  .tab .cnt,.tab .ic{display:none}
  main{padding:12px}

<script>
/* ════════════════════════════════════════════════════════════
   설정 — Apps Script 배포 후 웹앱 URL을 아래에 넣으면
   모든 사용자가 별도 설정 없이 같은 데이터를 공유합니다.
   (비워두면 각 기기의 ⚙설정에서 입력한 URL 사용, 그것도 없으면 로컬 미리보기 모드)
═════════════════════════════════════════════════════════════ */
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbydYJICorNNqW4RHvvCl6ek_244ZP1MxhnNP_focaHCte1mdWElngxezRUbZRYEm96f/exec'
};
var APP_VERSION = '20261111a';

var LG = {SINGLE:90, ANNUAL:150, WARN:0.8};
var REGIONS = {us:'미국', ca:'캐나다', pl:'폴란드', eu:'유럽(기타)', cn:'중국', vn:'베트남', etc:'기타 해외', kr:'국내'};
var ORG = {hq:'본사', able:'ABLE'};
var LSK = {api:'able_api_url', me:'able_me', cache:'able_cache_v1', local:'able_local_v1', pend:'able_pending_v1', ui:'able_ui_v1'};
var DEFAULT_SITES = [
  ['ESHD','us','#1558a0',150,150],['ESMI','us','#72128c'],['ESHG','us','#3c3489'],['MILS','us','#2e6e18'],
  ['UC2','us','#4a7a10'],['현대JV','us','#1a6080'],['ESOT','ca','#7a4208'],['WA','pl','#8a2a10'],
  ['ESNA','cn','#0a5e40'],['본사(국내)','kr','#475569']
];

/* ── 유틸 ── */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dn(s){if(!s)return NaN;var p=String(s).slice(0,10).split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5);}
function sdn(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
var WK=['일','월','화','수','목','금','토'];
function wd(s){return WK[new Date(dn(s)*864e5).getUTCDay()];}
function fmtMD(s){if(!s)return '';var p=s.split('-');return (+p[1])+'/'+(+p[2]);}
function fmtFull(s){if(!s)return '';var p=s.split('-');return p[0]+'.'+p[1]+'.'+p[2]+' ('+wd(s)+')';}
function fmtDot(s){if(!s)return '';return s.replace(/-/g,'.');}
function days(a,b){return dn(b)-dn(a)+1;}
function TD(){return dn(todayStr());}
function orgBadge(o){return '<span class="badge '+(o==='able'?'b-able':'b-hq')+'">'+(ORG[o]||'본사')+'</span>';}
function toast(msg,err){var t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast'+(err?' err':'');},2600);}
function byKo(a,b){return String(a).localeCompare(String(b),'ko');}

/* ══════════ 데이터 / 동기화 ══════════ */
var DB = {sites:[],persons:[],trips:[],reports:[],config:[]};
var TYPES = ['sites','persons','trips','reports','config'];
var pending = lsGet(LSK.pend,[]);
var syncing=false, lastSync=null, syncErr=false;

function apiUrl(){return (lsGet(LSK.api,'')||CONFIG.API_URL||'').trim();}
function isRemote(){return !!apiUrl();}

function seedLocal(){
  return {sites:DEFAULT_SITES.map(function(s,i){return {id:'site_'+i,name:s[0],region:s[1],color:s[2],order:i,lgAnnual:s[3]||'',lgSingle:s[4]||''};}),persons:[],trips:[],reports:[],config:[]};
}
function normalize(d){
  var o={};TYPES.forEach(function(t){o[t]=Array.isArray(d&&d[t])?d[t].filter(function(r){return r&&r.id;}):[];});
  o.sites.sort(function(a,b){return (+a.order||0)-(+b.order||0)||byKo(a.name,b.name);});
  return o;
}
function applyPending(){
  pending.forEach(function(op){
    var arr=DB[op.type];if(!arr)return;
    var i=arr.findIndex(function(r){return r.id===(op.record?op.record.id:op.id);});
    if(op.action==='upsert'){if(i>=0)arr[i]=op.record;else arr.push(op.record);}
    else if(op.action==='delete'&&i>=0)arr.splice(i,1);
  });
}
function persistLocal(){
  if(isRemote())lsSet(LSK.cache,DB);else lsSet(LSK.local,DB);
}
function setSync(state,txt){var s=$('sync');s.className='sync '+state;$('syncTxt').textContent=txt;}
function syncLabel(){
  if(!isRemote()){setSync('local','로컬 모드');return;}
  if(syncErr){setSync('err',pending.length?'미전송 '+pending.length+'건':'연결 오류');return;}
  if(pending.length){setSync('busy','전송 대기 '+pending.length);return;}
  setSync('ok',lastSync?('동기화 '+pad(lastSync.getHours())+':'+pad(lastSync.getMinutes())):'연결됨');
}

function apiGet(){
  return fetch(apiUrl()+'?action=load&_='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(j){if(!j||j.ok===false)throw new Error((j&&j.error)||'불러오기 실패');return j.data||j;});
}
function apiPost(body){
  return fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(j){if(!j||!j.ok)throw new Error((j&&j.error)||'저장 실패');return j;});
}
function flushPending(){
  if(!isRemote()||!pending.length)return Promise.resolve();
  var op=pending[0];
  return apiPost(op).then(function(){pending.shift();lsSet(LSK.pend,pending);return flushPending();});
}
function sync(silent){
  $('banner').classList.toggle('show',!isRemote());
  if(!isRemote()){
    DB=normalize(lsGet(LSK.local,null)||seedLocal());lsSet(LSK.local,DB);syncLabel();renderAll();afterFirstLoad();return Promise.resolve();
  }
  if(syncing)return Promise.resolve();
  syncing=true;if(!silent)setSync('busy','동기화 중…');
  return flushPending().then(apiGet).then(function(d){
    DB=normalize(d);applyPending();lsSet(LSK.cache,DB);lastSync=new Date();syncErr=false;
  }).catch(function(e){
    syncErr=true;if(!silent)toast('서버 연결 실패: '+e.message+' (마지막 데이터로 표시)',true);
  }).then(function(){syncing=false;syncLabel();renderAll();afterFirstLoad();});
}
var firstLoaded=false;
function afterFirstLoad(){if(firstLoaded)return;firstLoaded=true;if(!editingReport&&!$('drProgress').value)onAuthorChange();}
function save(type,rec){
  rec.updatedAt=new Date().toISOString();
  var arr=DB[type],i=arr.findIndex(function(r){return r.id===rec.id;});
  if(i>=0)arr[i]=rec;else arr.push(rec);
  commit({action:'upsert',type:type,record:rec});
}
function remove(type,id){
  var arr=DB[type],i=arr.findIndex(function(r){return r.id===id;});
  if(i>=0)arr.splice(i,1);
  commit({action:'delete',type:type,id:id});
}
function commit(op){
  persistLocal();renderAll();
  if(!isRemote())return;
  pending.push(op);lsSet(LSK.pend,pending);syncLabel();
  flushPending().then(function(){syncErr=false;lastSync=new Date();syncLabel();})
  .catch(function(e){syncErr=true;syncLabel();toast('서버 저장 실패 — 기기에 보관 후 자동 재전송합니다 ('+e.message+')',true);});
}

/* ── 조회 헬퍼 ── */
function siteById(id){return DB.sites.find(function(s){return s.id===id;});}
function siteName(id){var s=siteById(id);return s?s.name:'(삭제된 사이트)';}
function siteColor(id){var s=siteById(id);return s?s.color:'#94a3b8';}
function siteRegion(id){var s=siteById(id);return s?s.region:'etc';}
function siteChip(id){return '<span class="site-chip"><i style="background:'+esc(siteColor(id))+'"></i>'+esc(siteName(id))+'</span>';}
function personByName(n){return DB.persons.find(function(p){return p.name===n;});}
function orgOf(name){var p=personByName(name);if(p)return p.org;var t=DB.trips.find(function(t){return t.name===name;});return t?t.org:'hq';}
function allNames(){
  var m={};DB.persons.forEach(function(p){m[p.name]=1;});DB.trips.forEach(function(t){m[t.name]=1;});
  return Object.keys(m).filter(Boolean).sort(byKo);
}
function tripStatus(t){var T=TD();if(dn(t.end)<T)return 'done';if(dn(t.start)>T)return 'plan';return 'go';}
function currentTrip(name){var T=TD();return DB.trips.find(function(t){return t.name===name&&dn(t.start)<=T&&dn(t.end)>=T;});}
function ensurePerson(name,org){
  name=(name||'').trim();if(!name)return;
  var p=personByName(name);
  if(!p)save('persons',{id:uid('p_'),name:name,org:org||'hq',position:'',role:'',note:''});
}

/* ══════════ 미국 체류 계산 (LG 기준) ══════════
   · 미국 사이트(지역=미국) 출장만 체류일로 계산. 캐나다·폴란드·중국 등은 별도 집계만.
   · 어느 날이든 그날까지 365일 동안 미국 체류 ≤ 1년 한도, 1회 연속 체류 ≤ 1회 한도
   · 귀국 없이 이어진 미국 출장(다음 출발일 ≤ 이전 귀국일+1)은 1회로 합산
   · 사이트별 한도(예: ESHD 1회 150일)는 사이트 관리/기준 설정에서 지정, 없으면 기본값  */
var DEF_RULES={annual:150,single:90,target:60,warn:0.8};
var _memo={};
function clearMemo(){_memo={};}
function getRules(){
  var c=(DB.config||[]).find(function(r){return r.id==='rules';}),o={};
  try{o=c&&c.json?JSON.parse(c.json):{};}catch(e){o={};}
  var R=Object.assign({},DEF_RULES,o);['annual','single','target'].forEach(function(k){R[k]=Math.max(1,+R[k]||DEF_RULES[k]);});
  return R;
}
function siteRule(siteId){var R=getRules(),s=siteId?siteById(siteId):null;
  return {annual:+(s&&s.lgAnnual)||R.annual,single:+(s&&s.lgSingle)||R.single,custom:!!(s&&(+s.lgAnnual||+s.lgSingle))};}
function isUS(t){return siteRegion(t.siteId)==='us';}
function buildCtx(name,mode,excl,extra){
  var T=TD();
  var all=DB.trips.filter(function(t){return t.name===name&&t.id!==excl&&(mode!=='started'||dn(t.start)<=T);});
  if(extra)all=all.concat([extra]);
  var us=all.filter(isUS),set=new Set(),last=-1e9;
  us.forEach(function(t){for(var d=dn(t.start),e=dn(t.end);d<=e;d++)set.add(d);last=Math.max(last,dn(t.end));});
  return {all:all,us:us,set:set,last:last,
    ivs:all.map(function(t){return [dn(t.start),dn(t.end)];}),
    usIv:us.map(function(t){return {s:dn(t.start),e:dn(t.end),single:siteRule(t.siteId).single};})};
}
function mergeStays(list){
  list=list.slice().sort(function(a,b){return a.s-b.s;});var out=[];
  list.forEach(function(x){var c=out[out.length-1];
    if(c&&x.s<=c.e+1){c.e=Math.max(c.e,x.e);c.single=Math.min(c.single,x.single);c.n++;}
    else out.push({s:x.s,e:x.e,single:x.single,n:1});});
  out.forEach(function(o){o.len=o.e-o.s+1;});return out;
}
function rollingPeak(has,from,to){
  var c=0,d;for(d=from-364;d<=from;d++)if(has(d))c++;
  var mx=c,at=from;
  for(d=from+1;d<=to;d++){c+=(has(d)?1:0)-(has(d-365)?1:0);if(c>mx){mx=c;at=d;}}
  return {max:mx,at:at};
}
/* 미국 출장 계획(s~e, siteId) 가능 여부 */
function checkPlan(ctx,siteId,s,e){
  var R=siteRule(siteId);
  for(var i=0;i<ctx.ivs.length;i++){var v=ctx.ivs[i];if(v[0]<=e&&v[1]>=s)return {ok:false,why:'overlap'};}
  var st=mergeStays(ctx.usIv.concat([{s:s,e:e,single:R.single}])).find(function(o){return o.s<=s&&o.e>=s;});
  if(st.len>st.single)return {ok:false,why:'single',stay:st};
  var set=ctx.set,has=function(d){return set.has(d)||(d>=s&&d<=e);};
  var pk=rollingPeak(has,s,Math.min(Math.max(ctx.last,e),e+364));
  if(pk.max>R.annual)return {ok:false,why:'annual',peak:pk.max,at:pk.at};
  return {ok:true,peak:pk.max,at:pk.at,stay:st};
}
var WHY={overlap:'기존 출장과 겹침',single:'1회 한도',annual:'최근 1년 한도'};
function whyText(r,siteId){var R=siteRule(siteId);
  if(r.why==='single')return '1회 한도 '+(r.stay?r.stay.single:R.single)+'일'+(r.stay&&r.stay.n>1?' (이어진 출장 합산)':'');
  if(r.why==='annual')return '최근 1년 한도 '+R.annual+'일';return WHY[r.why]||'';}
/* s 출발 시 최대 체류 가능 일수 */
function maxStay(ctx,siteId,s){
  var R=siteRule(siteId),f1=checkPlan(ctx,siteId,s,s);
  if(!f1.ok)return {max:0,why:f1};
  var lo=1,hi=R.single;
  while(lo<hi){var m=Math.ceil((lo+hi)/2);if(checkPlan(ctx,siteId,s,s+m-1).ok)lo=m;else hi=m-1;}
  var nx=lo<R.single?checkPlan(ctx,siteId,s,s+lo):{why:'single',stay:{single:R.single,n:1}};
  return {max:lo,why:nx};
}
/* n일 연속 출장이 가능한 가장 빠른 출발일 (from부터 2년 탐색) */
function earliestStart(ctx,siteId,n,from){
  for(var s=from;s<from+730;s++){if(checkPlan(ctx,siteId,s,s+n-1).ok)return s;}
  return null;
}
/* 인원별 미국 체류 현황 */
function usStatus(name){
  var key='us|'+name;if(_memo[key])return _memo[key];
  var R=getRules(),T=TD(),ctx=buildCtx(name,'all');
  var set=ctx.set,has=function(d){return set.has(d);};
  var cur=0;for(var d=T-364;d<=T;d++)if(set.has(d))cur++;
  var pk=rollingPeak(has,T,Math.max(T,ctx.last));
  var stays=mergeStays(ctx.usIv),live=stays.filter(function(o){return o.e>=T-364;});
  var longest=live.reduce(function(m,o){return o.len>m.len?o:m;},{len:0});
  var singleBad=live.filter(function(o){return o.len>o.single;});
  var curTrip=DB.trips.find(function(t){return t.name===name&&dn(t.start)<=T&&dn(t.end)>=T;});
  var nextUS=ctx.us.filter(function(t){return dn(t.start)>T;}).sort(function(a,b){return dn(a.start)-dn(b.start);})[0]||null;
  var exc=earliestStart(buildCtx(name,'started'),null,R.target,T);
  var inc=earliestStart(ctx,null,R.target,T);
  var st='ok',why=[];
  if(pk.max>R.annual){st='bad';why.push('최근 1년 '+pk.max+'일 ('+fmtDot(sdn(pk.at))+') > '+R.annual+'일');}
  singleBad.forEach(function(o){st='bad';why.push('연속 체류 '+o.len+'일 ('+fmtMD(sdn(o.s))+'~'+fmtMD(sdn(o.e))+') > '+o.single+'일');});
  if(st==='ok'){
    if(pk.max>=R.annual*R.warn){st='warn';why.push('최근 1년 최고 '+pk.max+'일 (한도의 80% 이상)');}
    live.filter(function(o){return o.e>=T&&o.len>=o.single*R.warn;}).forEach(function(o){st='warn';why.push('연속 체류 '+o.len+'일 / '+o.single+'일');});
  }
  var r={cur:cur,peak:pk.max,peakAt:sdn(pk.at),remain:R.annual-pk.max,longest:longest.len?longest:null,
    curTrip:curTrip,inUS:!!(curTrip&&isUS(curTrip)),nextUS:nextUS,
    tgtExc:exc==null?null:sdn(exc),tgtInc:inc==null?null:sdn(inc),status:st,why:why,
    hasUS:ctx.us.length>0,trips:ctx.us.length};
  _memo[key]=r;return r;
}
function lgStatus(name){return usStatus(name);}
/* 출장 등록 모달용 확인 문구 */
function planCheckHtml(name,siteId,start,end,excl){
  var s=dn(start),e=dn(end),n=e-s+1,R=siteRule(siteId),ctx=buildCtx(name,'all',excl),r=checkPlan(ctx,siteId,start?s:0,e);
  var lim='<span class="muted">기준: 1년 '+R.annual+'일 · 1회 '+R.single+'일'+(R.custom?' ('+esc(siteName(siteId))+' 사이트 기준)':'')+'</span>';
  var h;
  if(r.ok){
    var w=r.peak>=R.annual*getRules().warn||r.stay.len>=r.stay.single*getRules().warn;
    h='<span class="badge '+(w?'b-warn':'b-ok')+'" style="height:22px;font-size:12px">'+(w?'가능 (주의)':'가능')+'</span> 미국 '+n+'일'
      +(r.stay.n>1?' · 앞뒤 출장과 이어져 연속 <b>'+r.stay.len+'일</b>':'')+'<br>이 출장 포함 최근 1년 최고 <b>'+r.peak+'</b> / '+R.annual+'일 · 잔여 '+(R.annual-r.peak)+'일';
  }else{
    var ms=maxStay(ctx,siteId,s),ea=earliestStart(ctx,siteId,n,Math.max(TD(),s));
    h='<span class="badge b-bad" style="height:22px;font-size:12px">불가</span> 미국 '+n+'일 — <b>'+esc(whyText(r,siteId))+'</b>'
      +(r.why==='annual'?' 초과 ('+fmtDot(sdn(r.at))+' 기준 '+r.peak+'일)':'')
      +'<br>▸ '+(ms.max?'이 출발일로 최대 <b>'+ms.max+'일</b> 가능 (복귀 '+fmtFull(sdn(s+ms.max-1))+')':'이 출발일로는 출발 불가 ('+esc(whyText(ms.why,siteId))+')')
      +'<br>▸ '+n+'일 출장 가능한 가장 빠른 출발일: <b>'+(ea!=null?fmtFull(sdn(ea)):'2년 내 없음')+'</b>';
  }
  return h+'<br>'+lim;
}

function renderGantt(list){
  var px=ZOOM[UI.tpZoom],T=TD(),narrow=window.innerWidth<640,LW=narrow?118:210;
  var minS=Math.min.apply(null,list.map(function(t){return dn(t.start);})),maxE=Math.max.apply(null,list.map(function(t){return dn(t.end);}));
  var a=new Date(Math.min(minS,T-14)*864e5),b=new Date(Math.max(maxE,T+60)*864e5);
  var start=Math.round(Date.UTC(a.getUTCFullYear(),a.getUTCMonth(),1)/864e5);
  var end=Math.round(Date.UTC(b.getUTCFullYear(),b.getUTCMonth()+1,0)/864e5);
  var nDays=end-start+1,W=nDays*px;
  // 그룹: 사이트 → 인원
  var bySite={};list.forEach(function(t){(bySite[t.siteId]=bySite[t.siteId]||{})[t.name]=(bySite[t.siteId][t.name]||[]).concat(t);});

    var we=(dw===0||dw===6)&&px>=10;
    if(show||we||d===T)h+='<div class="g-day'+(we?' we':'')+(d===T?' td':'')+'" style="left:'+((d-start)*px)+'px;width:'+Math.max(px,d===T?18:px)+'px">'+(show||d===T?dd:'')+'</div>';
  }
  h+='</div></div><div class="g-body">';
  // 배경
  h+='<div class="g-bg" style="left:'+LW+'px;width:'+W+'px">';

  if(T>=start&&T<=end)h+='<div class="g-today" style="left:'+((T-start)*px+px/2-1)+'px"></div>';
  h+='</div>';

      var a=bySite[sid][x],b=bySite[sid][y];var oa=(a[0].org==='able'?1:0),ob=(b[0].org==='able'?1:0);
      return oa-ob||Math.min.apply(null,a.map(function(t){return dn(t.start);}))-Math.min.apply(null,b.map(function(t){return dn(t.start);}));});
    h+='<div class="g-row site" style="height:30px"><div class="g-lc" style="width:'+LW+'px"><i style="width:10px;height:10px;border-radius:3px;background:'+esc(siteColor(sid))+'"></i>'+esc(siteName(sid))+'<span class="badge b-gray">'+(REGIONS[siteRegion(sid)]||'기타')+'</span><span class="faint" style="font-weight:600;font-size:11px">'+people.length+'명</span></div><div class="g-tl" style="width:'+W+'px"></div></div>';

      var tasks={};ts.forEach(function(t){if(t.task)tasks[t.task]=1;});
      h+='<div class="g-row" style="height:38px"><div class="g-lc" style="width:'+LW+'px"><div class="nm"><span class="t">'+esc(nm)+'</span>'+orgBadge(org)+'</div><div class="sub">'+esc(Object.keys(tasks).join(', ')||'-')+'</div></div><div class="g-tl" style="width:'+W+'px">';
      ts.forEach(function(t){
        var s=Math.max(dn(t.start),start),e=Math.min(dn(t.end),end);if(e<s)return;
        var n=days(t.start,t.end),st=tripStatus(t),bw=(e-s+1)*px;
        var txt=bw>150?(esc(nm)+' · '+fmtMD(t.start)+'~'+fmtMD(t.end)+' ('+n+'일)'):bw>60?(fmtMD(t.start)+'~'+fmtMD(t.end)):bw>26?n+'일':'';
        var tip=nm+' ('+(ORG[org]||'')+') | '+siteName(t.siteId)+(t.task?' · '+t.task:'')+'\n'+fmtFull(t.start)+' ~ '+fmtFull(t.end)+' · '+n+'일'+(t.note?'\n'+t.note:'');
        h+='<div class="g-bar '+(org==='able'?'able':'hq')+' '+st+'" data-act="tedit" data-id="'+esc(t.id)+'" title="'+esc(tip)+'" style="left:'+((s-start)*px)+'px;width:'+Math.max(bw,6)+'px"><span style="left:'+(LW+6)+'px">'+txt+'</span></div>';
      });
      h+='</div></div>';
    });
  });
  h+='</div></div></div>';
  var keepX=$('gwrap')?$('gwrap').scrollLeft:null;
  $('tpBody').innerHTML=h;

}

function tripCheck(id){
  var n=$('mtName').value.trim(),sid=$('mtSite').value,s=$('mtStart').value,e=$('mtEnd').value,el=$('mtCheck');

  var h='출장 기간 <b>'+days(s,e)+'일</b> ('+fmtFull(s)+' ~ '+fmtFull(e)+')';

/* ── 국가별 현황 ── */
function renderCountry(){
  var T=TD(),y0=dn(new Date().getFullYear()+'-01-01');
  var rows=baseFilter(personBase()).map(function(r){
    var c12={},cy={},n={};
    DB.trips.forEach(function(t){if(t.name!==r.name)return;var rg=siteRegion(t.siteId);
      n[rg]=(n[rg]||0)+1;c12[rg]=c12[rg]||new Set();cy[rg]=cy[rg]||new Set();
      for(var d=dn(t.start),e=dn(t.end);d<=e;d++){if(d>=T-364&&d<=T)c12[rg].add(d);if(d>=y0&&d<=T)cy[rg].add(d);}});
    r.c12={};r.cy={};Object.keys(c12).forEach(function(k){r.c12[k]=c12[k].size;r.cy[k]=cy[k].size;});
    var ab=new Set();Object.keys(c12).forEach(function(k){if(k!=='kr')c12[k].forEach(function(d){ab.add(d);});});r.abroad=ab.size;
    r.nextT=DB.trips.filter(function(t){return t.name===r.name&&dn(t.start)>T;}).sort(function(a,b){return dn(a.start)-dn(b.start);})[0];
    return r;});
  var used=COUNTRY_COLS.filter(function(k){return DB.trips.some(function(t){return siteRegion(t.siteId)===k;});});
  if(used.indexOf('us')<0)used.unshift('us');
  var cnt=function(k){return personBase().filter(function(r){return r.cur&&siteRegion(r.cur.siteId)===k;}).length;};
  $('pmStats').innerHTML=used.filter(function(k){return k!=='kr';}).slice(0,5).map(function(k){return stat(cnt(k),REGIONS[k]+' 체류중','오늘 기준');}).join('');
  var val={name:function(r){return r.name;},abroad:function(r){return r.abroad;}};

  var h='<table class="xt"><thead><tr>'+th('name','이름','stk')+'<th>현재 위치</th>';
  used.forEach(function(k){h+=th('c_'+k,(k==='kr'?'국내 출장':REGIONS[k])+'<br><small>12M · '+new Date().getFullYear()+'년</small>','num'+(k==='us'?' usc':''));});
  h+=th('abroad','해외 합계<br><small>12M</small>','num')+'<th>다음 출장</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr class="pr" data-act="pexp" data-name="'+esc(r.name)+'"><td class="stk"><span class="faint" style="font-size:10px">'+(pmExpanded[r.name]?'▼':'▶')+'</span> <span class="pname">'+esc(r.name)+'</span> '+orgBadge(r.org)+'</td><td>'+locHtml(r.cur)+'</td>';
    used.forEach(function(k){var a=r.c12[k]||0,b=r.cy[k]||0;h+='<td class="num'+(k==='us'?' usc':'')+'">'+(a||b?'<b>'+a+'</b> <span class="faint">· '+b+'</span>':'<span class="faint">-</span>')+'</td>';});
    h+='<td class="num"><b>'+r.abroad+'</b></td><td>'+(r.nextT?'<span class="badge b-gray">'+(REGIONS[siteRegion(r.nextT.siteId)]||'')+'</span> '+siteChip(r.nextT.siteId)+' <span style="font-size:12px">'+fmtMD(r.nextT.start)+'~'+fmtMD(r.nextT.end)+'</span>':'<span class="faint">-</span>')+'</td></tr>';
    if(pmExpanded[r.name])h+='<tr class="exp"><td colspan="'+(used.length+4)+'">'+histHtml(r.name,'all')+'</td></tr>';
  });
  $('pmBody').innerHTML=h+'</tbody></table>';
  $('pmNote').innerHTML='· 국가별 체류일: <b>최근 12개월</b> · <b>올해</b>(1/1~오늘) 실제 체류일(출발·귀국일 포함, 같은 날 중복은 1일). 국가는 사이트 관리의 지역으로 정해집니다.<br>· LG 기준 비교는 <b>미국만</b> 합니다(🇺🇸 미국 체류 현황). 캐나다는 별도 집계입니다.';
}
function meter(v,max){var pct=Math.min(100,v/max*100),cls=v>max?'b':v>=max*getRules().warn?'w':'';
  return '<div class="meter"><div class="bar"><i class="'+cls+'" style="width:'+pct+'%"></i></div><span class="num">'+v+'<small> / '+max+'</small></span></div>';}
function numCell(v,max){var c=v>max?'var(--bad)':v>=max*getRules().warn?'var(--warn)':'inherit';return '<b style="color:'+c+'">'+v+'</b>';}
function histHtml(name,mode){
  var T=TD(),p=personByName(name);
  var trips=DB.trips.filter(function(t){return t.name===name&&(mode!=='us'||isUS(t));}).sort(function(a,b){return dn(b.start)-dn(a.start);});
  if(!trips.length)return '<div class="hist faint">출장 이력이 없습니다.</div>';
  var stays=mode==='us'?mergeStays(buildCtx(name,'all').usIv):[];
  var h='<div class="hist">'+(p&&p.note?'<div style="margin-bottom:6px;font-size:12.5px">📌 '+esc(p.note)+'</div>':'')+'<table><thead><tr><th>상태</th><th>국가</th><th>사이트</th><th>업무</th><th>기간</th><th style="text-align:right">일수</th>'+(mode==='us'?'<th>연속 체류</th>':'')+'<th></th></tr></thead><tbody>';
  trips.forEach(function(t){var st=tripStatus(t),rg=siteRegion(t.siteId);
    var sty=stays.find(function(o){return o.s<=dn(t.start)&&o.e>=dn(t.start);});
    h+='<tr><td><span class="badge '+{go:'b-go',plan:'b-plan',done:'b-done'}[st]+'">'+{go:'출장중',plan:'예정',done:'완료'}[st]+'</span></td><td>'+(REGIONS[rg]||'기타')+'</td><td>'+siteChip(t.siteId)+'</td><td>'+esc(t.task||'-')+'</td><td>'+fmtDot(t.start)+' ~ '+fmtDot(t.end)+'</td><td style="text-align:right"><b>'+days(t.start,t.end)+'</b></td>'
      +(mode==='us'?'<td>'+(sty&&sty.n>1?'<span style="color:'+(sty.len>sty.single?'var(--bad)':'var(--warn)')+'">이어진 출장 합산 '+sty.len+'/'+sty.single+'일</span>':'<span class="faint">'+(sty?sty.len+'/'+sty.single+'일':'')+'</span>')+'</td>':'')
      +'<td><button class="btn sm ghost" data-act="tedit" data-id="'+esc(t.id)+'">수정</button></td></tr>';});
  return h+'</tbody></table></div>';
}

  var names=allNames();
  var rows=names.map(function(n){var p=personByName(n)||{id:'',name:n,org:orgOf(n),position:'',role:'',note:''};
    var used=DB.trips.some(function(t){return t.name===n;})||DB.reports.some(function(r){return r.author===n;});
    return '<tr data-pid="'+esc(p.id)+'" data-name="'+esc(n)+'"><td><b>'+esc(n)+'</b></td><td><select class="sel po" style="width:90px"><option value="hq"'+(p.org!=='able'?' selected':'')+'>본사</option><option value="able"'+(p.org==='able'?' selected':'')+'>ABLE</option></select></td><td><input class="inp pp" value="'+esc(p.position)+'" placeholder="직급"></td><td><input class="inp pr2" value="'+esc(p.role)+'" placeholder="담당업무"></td><td><input class="inp pn" value="'+esc(p.note)+'" placeholder="비고"></td><td>'+(used?'':'<button class="btn sm danger" data-act="pdel" data-id="'+esc(p.id)+'">삭제</button>')+'</td></tr>';}).join('');
  var b='<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><input class="inp" id="npName" placeholder="이름" style="flex:1;min-width:100px"><select class="sel" id="npOrg" style="width:100px"><option value="hq">본사</option><option value="able">ABLE</option></select><input class="inp" id="npPos" placeholder="직급" style="width:90px"><input class="inp" id="npRole" placeholder="담당업무" style="flex:1;min-width:100px"><button class="btn pri" data-act="padd">추가</button></div>'
   +'<div style="overflow:auto"><table class="mtable" style="min-width:620px"><thead><tr><th>이름</th><th>소속</th><th>직급</th><th>담당업무</th><th>비고</th><th></th></tr></thead><tbody id="pRows">'+rows+'</tbody></table></div>'
   +'<p class="note">출장 등록·일일보고 작성 시 처음 입력한 이름은 자동으로 추가됩니다. 이력이 있는 인원은 삭제할 수 없습니다.<br>※ 개인정보 보호를 위해 연락처·여권번호 등은 기록하지 마세요 (링크를 아는 누구나 볼 수 있습니다).</p>';
  openModal('👥 인원 관리 ('+names.length+'명)',b,'<button class="btn" data-act="mclose">닫기</button><button class="btn pri" data-act="psave">변경 저장</button>',true);
}
function savePersons(){
  var n=0;document.querySelectorAll('#pRows tr').forEach(function(tr){
    var p=personByName(tr.dataset.name)||{id:uid('p_'),name:tr.dataset.name,org:'hq',position:'',role:'',note:''};
    var nv={id:p.id,name:p.name,org:tr.querySelector('.po').value,position:tr.querySelector('.pp').value.trim(),role:tr.querySelector('.pr2').value.trim(),note:tr.querySelector('.pn').value.trim()};
    if(!tr.dataset.pid||nv.org!==p.org||nv.position!==(p.position||'')||nv.role!==(p.role||'')||nv.note!==(p.note||'')){save('persons',nv);n++;}
  });
  toast(n?n+'명 저장되었습니다':'변경 사항이 없습니다');openPersons();
}
function addPerson(){
  var nm=$('npName').value.trim();if(!nm)return toast('이름을 입력하세요',true);
  if(personByName(nm))return toast('이미 등록된 이름입니다',true);
  save('persons',{id:uid('p_'),name:nm,org:$('npOrg').value,position:$('npPos').value.trim(),role:$('npRole').value.trim(),note:''});
  toast(nm+' 추가됨');openPersons();
}


/* ══════════ 설정 ══════════ */
function openSettings(){
  var b='<div class="fg"><label class="lbl">Apps Script 웹앱 URL<span class="hint">배포 → 웹 앱 URL (…/exec)</span></label><input class="inp" id="setUrl" value="'+esc(lsGet(LSK.api,'')||'')+'" placeholder="'+(CONFIG.API_URL?'(코드에 기본 URL 설정됨 — 비워두면 기본값 사용)':'https://script.google.com/macros/s/…/exec')+'"></div>'
   +'<div style="display:flex;gap:8px;margin-bottom:16px"><button class="btn" data-act="settest">연결 테스트</button><span id="setRes" style="align-self:center;font-size:13px"></span></div>'
   +'<div class="fg"><label class="lbl">내 이름<span class="hint">일일보고 작성 시 자동 입력</span></label><input class="inp" id="setMe" list="dlPersons" value="'+esc(lsGet(LSK.me,''))+'"></div>'
   +'<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="backup">💾 JSON 백업 다운로드</button>'+(isRemote()?'':'<button class="btn" data-act="sample">샘플 데이터 넣기 (미리보기용)</button><button class="btn danger" data-act="resetlocal">로컬 데이터 초기화</button>')+'</div>'
   +'<p class="note">현재 모드: <b>'+(isRemote()?'서버 공유 모드':'로컬 미리보기 모드')+'</b> · 미전송 '+pending.length+'건 · 버전 '+APP_VERSION+'</p>';
  openModal('⚙ 설정',b,'<button class="btn" data-act="mclose">닫기</button><button class="btn pri" data-act="setsave">저장</button>');
}
function testUrl(){
  var u=$('setUrl').value.trim()||CONFIG.API_URL;if(!u){$('setRes').innerHTML='<span style="color:var(--warn)">URL을 입력하세요</span>';return;}
  $('setRes').textContent='확인 중…';
  fetch(u+'?action=ping&_='+Date.now()).then(function(r){return r.json();}).then(function(j){$('setRes').innerHTML=j&&j.ok?'<span style="color:var(--ok);font-weight:700">✓ 연결 성공'+(j.sheet?' ('+esc(j.sheet)+')':'')+'</span>':'<span style="color:var(--bad)">응답 이상</span>';})
  .catch(function(e){$('setRes').innerHTML='<span style="color:var(--bad)">실패: '+esc(e.message)+'</span>';});
}
function saveSettings(){
  var u=$('setUrl').value.trim();
  if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u))return toast('URL 형식이 올바르지 않습니다 (…/exec 로 끝나야 함)',true);
  var was=apiUrl();lsSet(LSK.api,u);lsSet(LSK.me,$('setMe').value.trim());
  closeModal();toast('저장되었습니다');
  if(was!==apiUrl()){if(isRemote()){var c=lsGet(LSK.cache,null);if(c)DB=normalize(c);}sync();}
  else resetReportForm();
}
function backup(){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));
  var d=new Date();a.download='ABLE_backup_'+todayStr().replace(/-/g,'')+'_'+pad(d.getHours())+pad(d.getMinutes())+'.json';a.click();
}
function loadSample(){
  if(!confirm('미리보기용 샘플 데이터를 추가할까요? (로컬 모드에서만 사용)'))return;
  var T=TD(),S=DB.sites;function sid(n){var s=S.find(function(x){return x.name===n;});return s?s.id:S[0].id;}
  var P=[['박우철','hq','책임','PM'],['김성민','hq','선임','Vision SW'],['강민호','hq','선임','HW'],['이준호','able','과장','셋업'],['정다은','able','대리','셋업'],['최현수','able','사원','양산대응'],['한지훈','able','과장','셋업']];
  P.forEach(function(p){if(!personByName(p[0]))DB.persons.push({id:uid('p_'),name:p[0],org:p[1],position:p[2],role:p[3],note:''});});
  var tr=[['김성민','hq','ESHD','셋업',-200,-120],['김성민','hq','ESHD','셋업',-40,25],['강민호','hq','ESMI','양산대응',-10,40],['이준호','able','ESHD','셋업',-150,-70],['이준호','able','ESHD','셋업',-30,45],['정다은','able','ESHG','셋업',-20,50],['최현수','able','ESOT','양산대응',-5,60],['한지훈','able','ESHD','셋업',20,100],['박우철','hq','ESHD','PM',14,24],['강민호','hq','ESHD','셋업',-300,-215],['강민호','hq','WA','안정화',-120,-40],['한지훈','able','ESNA','개조',-90,-60],['정다은','able','ESOT','셋업',-200,-120],['최현수','able','ESHD','셋업',70,140],['김성민','hq','ESHD','셋업',26,60]];
  tr.forEach(function(t){DB.trips.push({id:uid('t_'),name:t[0],org:t[1],siteId:sid(t[2]),task:t[3],start:sdn(T+t[4]),end:sdn(T+t[5]),note:'',updatedAt:new Date().toISOString()});});
  var rp=[['김성민','hq','ESHD',0,'3호기 Calibration 완료\n4호기 I/O Check (Vision) 진행 70%','4호기 I/O Check 마무리\nGRR 샘플 준비','고객 요청: 검사 이미지 저장 경로 변경 검토'],['이준호','able','ESHD',0,'2호기 케이블 포설 및 Turn On (Ele.) 완료','2호기 CDA Turn On',''],['강민호','hq','ESMI',-1,'양산 모니터링, 과검 2건 분석','Recipe 파라미터 조정 적용','Light 컨트롤러 1EA 교체 필요 — 본사 발송 요청'],['정다은','able','ESHG',-1,'DNC 라인 설비 Installation 지원','Turn On 준비',''],['김성민','hq','ESHD',-1,'3호기 Calibration 진행','Calibration 완료','']];
  rp.forEach(function(r){DB.reports.push({id:uid('r_'),date:sdn(T+r[3]),siteId:sid(r[2]),author:r[0],org:r[1],progress:r[4],plan:r[5],issue:r[6],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});});
  persistLocal();closeModal();renderAll();toast('샘플 데이터가 추가되었습니다');
}

/* ══════════ 이벤트 ══════════ */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'mclose':closeModal();break;
    case 'redit':editReport(id);break;
    case 'rdel':var r=DB.reports.find(function(x){return x.id===id;});if(r&&confirm(r.author+'님의 '+fmtFull(r.date)+' 보고를 삭제할까요?')){remove('reports',id);toast('삭제되었습니다');if(editingReport&&editingReport.id===id)resetReportForm(true);}break;
    case 'rcopy':var r2=DB.reports.find(function(x){return x.id===id;});if(r2)copyText(reportText(r2));break;
    case 'gcopy':groupCopy(el.dataset.key);break;
    case 'pick':$('drAuthor').value=el.dataset.name;resetReportForm(true);$('drAuthor').value=el.dataset.name;onAuthorChange();$('drProgress').focus();if(window.innerWidth<860)$('drForm').scrollIntoView({behavior:'smooth'});break;
    case 'tedit':e.stopPropagation();openTrip(id);break;
    case 'tsave':saveTrip(id);break;
    case 'tdel':var t=DB.trips.find(function(x){return x.id===id;});if(t&&confirm(t.name+' / '+siteName(t.siteId)+' '+fmtDot(t.start)+'~'+fmtDot(t.end)+' 일정을 삭제할까요?')){remove('trips',id);closeModal();toast('삭제되었습니다');}break;
    case 'sadd':addSite();break;
    case 'ssave':saveSites();break;
    case 'sdel':if(confirm('이 사이트를 삭제할까요?')){remove('sites',id);openSites();}break;
    case 'psort':var k=el.dataset.k;if(UI.pmSort===k)UI.pmAsc=!UI.pmAsc;else{UI.pmSort=k;UI.pmAsc=(k==='name'||k==='exc'||k==='inc');}saveUI();renderPmBody();break;
    case 'pexp':pmExpanded[el.dataset.name]=!pmExpanded[el.dataset.name];renderPmBody();break;
    case 'rules':openRules();break;
    case 'rsave':saveRules();break;
    case 'padd':addPerson();break;
    case 'psave':savePersons();break;
    case 'pdel':if(id&&confirm('삭제할까요?')){remove('persons',id);openPersons();}break;
    case 'settest':testUrl();break;
    case 'setsave':saveSettings();break;
    case 'backup':backup();break;
    case 'sample':loadSample();break;
    case 'resetlocal':if(confirm('이 기기의 로컬 데이터를 모두 지울까요?')){localStorage.removeItem(LSK.local);closeModal();sync();}break;
  }
});
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){switchTab(b.dataset.tab);};});
$('sync').onclick=function(){sync();};
$('btnSettings').onclick=openSettings;$('bannerSet').onclick=openSettings;
$('drSubmit').onclick=submitReport;
$('drCancelEdit').onclick=function(){resetReportForm(true);};
$('drAuthor').addEventListener('change',onAuthorChange);
$('drMode').onclick=function(e){var b=e.target.closest('button');if(!b)return;UI.drMode=b.dataset.v;saveUI();renderReports();};
['drfSite','drfPerson','drfPeriod'].forEach(function(k){$(k).onchange=renderReports;});
$('drfQ').oninput=renderReports;
$('drCsv').onclick=exportCsv;
$('tpAdd').onclick=function(){openTrip(null);};
$('tpSites').onclick=openSites;
$('tpView').onclick=function(e){var b=e.target.closest('button');if(!b)return;UI.tpView=b.dataset.v;saveUI();renderTrips();};
$('tpZoom').onclick=function(e){var b=e.target.closest('button');if(!b)return;UI.tpZoom=b.dataset.v;ganttScrolled=false;saveUI();renderTrips();};
['tpfOrg','tpfCountry','tpfSite','tpfPast'].forEach(function(k){$(k).onchange=renderTrips;});
$('tpfQ').oninput=renderTrips;
$('pmSub').onclick=function(e){var b=e.target.closest('button');if(!b)return;UI.pmSub=b.dataset.v;UI.pmSort=b.dataset.v==='country'?'abroad':'name';UI.pmAsc=b.dataset.v!=='country';saveUI();renderPersons();};
$('fab').onclick=function(){
  if(UI.tab==='trip')openTrip(null);
  else if(UI.tab==='person')openPersons();
  else{resetReportForm(true);$('drForm').scrollIntoView({behavior:'smooth'});$('drProgress').focus();}
};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('modalRoot').innerHTML)closeModal();});
var rsT;window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){if(UI.tab==='trip'&&UI.tpView==='gantt')renderTrips();},200);});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&isRemote())sync(true);});
setInterval(function(){if(!document.hidden&&isRemote()&&!$('modalRoot').innerHTML)sync(true);},60000);

function setHH(){document.documentElement.style.setProperty('--hh',document.querySelector('.top').offsetHeight+'px');}
window.addEventListener('resize',setHH);
/* ── 시작 ── */
(function init(){
  if(isRemote()){var c=lsGet(LSK.cache,null);if(c){DB=normalize(c);applyPending();}}
  setHH();
  switchTab(UI.tab||'report');
  resetReportForm();
  sync();
})();
</script>
